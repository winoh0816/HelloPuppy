
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf5">
    <title>안녕멍뭉 - 식사/급여 인증</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<div class="app-container">

    <header>
        <h1>🥣 식사/급여 인증하기</h1>
    </header>

    <div class="content">

        <p>
            반려견에게 사료를 급여한 사진을 촬영하고<br>
            인증을 완료해 50P를 받아 보세요!
        </p>

        <!-- 급여 사진 미리보기 -->
        <div class="scanner-box">
            <img
                id="feeding-img"
                src="https://images.unsplash.com/photo-1589924691995-400dc9ecc119?auto=format&fit=crop&w=900&q=85"
                alt="반려견 사료 급여 예시"
            >

            <div
                class="scan-line"
                id="feeding-scan-line"
            ></div>

            <div style="
                position:absolute;
                top:10px;
                left:10px;
                background:rgba(0,0,0,0.5);
                color:white;
                padding:5px 10px;
                border-radius:5px;
                font-size:12px;
            ">
                🥣 사료 급여 인증<br>
                📸 급여 장면을 촬영해 주세요
            </div>
        </div>

        <!-- 카메라 촬영 또는 사진 선택 -->
        <input
            type="file"
            id="feeding-photo"
            accept="image/*"
            capture="environment"
            hidden
            onchange="previewFeedingPhoto(event)"
        >

        <button
            type="button"
            class="btn"
            onclick="document.getElementById('feeding-photo').click()"
        >
            📸 급여 사진 촬영하기
        </button>

        <!-- 사진 선택 후 표시 -->
        <p
            id="feeding-photo-status"
            style="
                text-align:center;
                font-size:13px;
                color:#888;
                margin-top:12px;
            "
        >
            사료를 급여하는 장면이나 급여한 사료가 보이도록 촬영해 주세요.
        </p>

        <!-- AI 검증 -->
        <button
            type="button"
            class="btn"
            onclick="startFeedingAuth()"
            style="background:#8ebd77"
        >
            🐶 촬영 사진 AI 인증하기
        </button>

        <div class="card" style="margin-top:20px">
            <strong>📌 인증 안내</strong>
            <p class="muted">
                1. 반려견의 사료 급여 장면을 촬영합니다.<br>
                2. 촬영한 사진을 확인합니다.<br>
                3. AI 검증을 진행합니다.<br>
                4. 인증 성공 시 50P를 적립합니다.
            </p>
        </div>

    </div>

    <!-- 하단 네비게이션 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>홈
        </a>
        <a href="auth.html" class="nav-item">
            <span class="nav-icon">🐾</span>산책
        </a>
        <a href="feed.html" class="nav-item">
            <span class="nav-icon">💬</span>커뮤니티
        </a>
        <a href="mypage.html" class="nav-item">
            <span class="nav-icon">⚙️</span>설정
        </a>
    </nav>

    <!-- 인증 진행 모달 -->
    <div id="loading-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="loading-spinner" class="spinner"></div>
            <h3
                id="loading-msg"
                style="margin:0; line-height:1.4;"
            ></h3>
        </div>
    </div>

    <script src="assets/js/app.js"></script>

</div>
</body>
</html>
