<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#fffaf5"><title>안녕멍뭉 - 영수증</title><link rel="stylesheet" href="assets/css/style.css?v=receipt-1"></head>
<body><div class="app-container"><header><h1><img class="brand-icon" src="assets/images/brand/icon-bone.png" alt=""> 영수증 리워드</h1></header>
    <div class="content">
        <p>오프라인 펫샵 결제 영수증을 인증하고<br>포인트를 받으세요!</p>
        <div class="scanner-box receipt-scanner">
            <img id="receipt-img" src="data:," alt="영수증 사진 미리보기" onerror="this.hidden=true" onload="this.hidden=false">
            <div class="receipt-placeholder" aria-hidden="true">🧾<span>영수증 전체가 보이게<br>밝은 곳에서 평평하게 찍어 주세요</span></div>
            <div class="scan-line"></div>
        </div>
        <input type="file" id="receipt-photo" accept="image/*" capture="environment" hidden onchange="previewVerificationPhoto(event, 'receipt')">
        <button class="btn" type="button" onclick="document.getElementById('receipt-photo').click()"><img class="brand-icon" src="assets/images/brand/icon-camera.png" alt=""> 영수증 촬영·사진 선택</button>
        <p id="receipt-photo-status" class="photo-status" role="status">매장명·거래일시·합계 금액이 잘리지 않게 찍어 주세요.</p>
        <button class="btn" type="button" onclick="startOCR()">영수증 텍스트 추출 (OCR)</button>
        <div id="receipt-result" class="verify-result" role="status" hidden></div>
        <p style="text-align:center; font-size:12px; color:#888; margin-top:15px;">* 오픈소스 OCR(RapidOCR · PaddleOCR 한국어 모델)이 서버에서 글자를 읽습니다. 반려동물 관련 구매, 최근 7일 이내 영수증만 인정되고, 같은 영수증은 한 번만, 영수증 리워드는 하루 1회 30P 적립됩니다.</p>
    </div>
