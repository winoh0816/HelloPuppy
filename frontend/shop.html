
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fffaf5">

    <title>안녕멍뭉 - 포인트 상점</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/api-client.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</head>

<body>
    <div class="app-container">

        <header>
            <h1><img class="brand-icon" src="assets/images/brand/icon-bone.png" alt=""> 포인트 상점</h1>
        </header>

        <main class="content">

            <!-- 내 포인트 -->
            <section class="shop-balance-card">
                <div class="shop-balance-label">
                    🐾 안녕멍뭉 보유 포인트
                </div>

                <div class="shop-balance-number">
                    <span id="pointBalance">0</span> P
                </div>

                <p class="shop-balance-description">
                    산책 · 급여 · 영수증 인증으로 포인트를 모아 보세요!
                </p>
            </section>

            <!-- 추천 안내 -->
            <section class="shop-recommend-card">
                <strong>🐶 초코를 위한 오늘의 추천</strong>

                <div>
                    모은 포인트로 반려견 사료, 간식, 영양제 샘플을 교환해 보세요.
                </div>
            </section>

            <!-- 상품 목록 -->
            <div class="section-heading">
                <span>🎁 교환 가능한 상품</span>
                <span class="muted">테스트용 상품</span>
            </div>

            <!-- 상품 카테고리 -->
            <div class="shop-filter-row" aria-label="상품 카테고리">
                <button
                    type="button"
                    class="shop-filter-btn active"
                    data-category="all"
                    aria-pressed="true"
                >
                    전체
                </button>

                <button
                    type="button"
                    class="shop-filter-btn"
                    data-category="사료"
                    aria-pressed="false"
                >
                    사료
                </button>

                <button
                    type="button"
                    class="shop-filter-btn"
                    data-category="간식"
                    aria-pressed="false"
                >
                    간식
                </button>

                <button
                    type="button"
                    class="shop-filter-btn"
                    data-category="영양제"
                    aria-pressed="false"
                >
                    영양제
                </button>

                <button
                    type="button"
                    class="shop-filter-btn"
                    data-category="용품"
                    aria-pressed="false"
                >
                    용품
                </button>
            </div>

            <!-- JavaScript에서 상품 목록 표시 -->
            <div
                class="shop-product-grid"
                id="productGrid"
                aria-live="polite"
            ></div>

            <!-- 교환 내역 -->
            <section>
                <div class="section-heading">
                    <span>📦 나의 교환 내역</span>
                    <span class="muted">최근 교환순</span>
                </div>

                <div id="exchangeHistory">
                    <div class="shop-empty-history">
                        아직 교환한 상품이 없어요.<br>
                        마음에 드는 상품을 교환해 보세요! 🐾
                    </div>
                </div>
            </section>

        </main>

        <!-- 공통 하단 메뉴 -->
        <nav class="bottom-nav" aria-label="주요 메뉴">
            <a href="index.html" class="nav-item">
                <span class="nav-icon"><img src="assets/images/brand/nav-home.png" alt=""></span>
                홈
            </a>

            <a href="auth.html" class="nav-item">
                <span class="nav-icon"><img src="assets/images/brand/nav-walk.png" alt=""></span>
                산책
            </a>

            <a
                href="shop.html"
                class="nav-item active"
                aria-current="page"
            >
                <span class="nav-icon"><img src="assets/images/brand/icon-bone.png" alt=""></span>
                상점
            </a>

            <a href="feed.html" class="nav-item">
                <span class="nav-icon"><img src="assets/images/brand/nav-community.png" alt=""></span>
                커뮤니티
            </a>

            <a href="mypage.html" class="nav-item">
                <span class="nav-icon"><img src="assets/images/brand/nav-settings.png" alt=""></span>
                설정
            </a>
        </nav>

        <!-- 교환 결과 알림 -->
        <div
            id="shopToast"
            class="shop-toast"
            role="status"
            aria-live="polite"
            hidden
        ></div>

    </div>
</body>
</html>
