<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#fffaf5"><title>안녕멍뭉 - 커뮤니티</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div class="app-container"><header><h1>💬 안녕멍뭉 피드</h1><a href="mypage.html" style="text-decoration:none;font-size:22px">⚙️</a></header>
<div class="content">
<div class="section-heading" style="margin-top:0">우리 동네 댕댕이 소식 🐶 <button class="btn" style="width:auto;margin:0;padding:8px 13px;font-size:12px" onclick="document.getElementById('composer').style.display=document.getElementById('composer').style.display==='none'?'block':'none'">＋ 글쓰기</button></div>
<div class="tabs" style="display:flex;gap:7px;margin:0 0 14px"><button class="pill" onclick="filterFeed('all',this)" style="border:0">전체</button><button class="pill" onclick="filterFeed('walk',this)" style="border:0;background:white">산책</button><button class="pill" onclick="filterFeed('daily',this)" style="border:0;background:white">일상</button><button class="pill" onclick="filterFeed('info',this)" style="border:0;background:white">정보공유</button></div>
<div id="composer" class="card" style="display:none"><b>새 게시글 쓰기 ✏️</b><input id="postTitle" class="field" placeholder="제목 (선택)"><textarea id="postBody" class="field" rows="3" placeholder="우리 강아지 이야기를 들려주세요 🐾"></textarea><button class="btn" onclick="publishPost()">게시하기</button></div>
<article class="card feed-post" data-kind="walk"><div class="post-meta"><div class="avatar">🐶</div><div><b>초코 맘</b><div class="muted">방금 전 · 📍 한강공원</div></div><span style="margin-left:auto">•••</span></div>
<img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=85" class="img-placeholder" alt="공원에서 함께 산책하는 강아지들">
<p class="post-copy">오늘 날씨가 너무 좋아서 한강 산책 나왔어요! 바람도 선선하고 초코도 신났어요 🐾 멍냥산책과 함께라 더 즐거운 하루!</p>
<div class="post-actions"><button onclick="toggleLike(this)">🤍 24 좋아요</button><button onclick="toast('댓글 기능은 서버 연결 후 사용할 수 있어요 💬')">💬 댓글 3</button><button onclick="toast('게시글을 저장했어요 🔖')">🔖 저장</button></div>
<p class="muted" style="border-top:1px solid var(--line);padding-top:10px;margin-bottom:0"><b>두부 아빠:</b> 동네 산책로 좋네요~ 코스 공유 부탁드려요!</p></article>
<article class="card feed-post" data-kind="daily"><div class="post-meta"><div class="avatar" style="background:#e5eddb">🐩</div><div><b>보리 누나</b><div class="muted">2시간 전</div></div></div>
<img src="https://images.unsplash.com/photo-1589924691995-400dc9ecc119?auto=format&fit=crop&w=900&q=85" class="img-placeholder" alt="강아지 사료와 식사">
<p class="post-copy">저녁밥 야무지게 먹는 보리! 급여 시간 맞춰서 건강 기록도 완료했어요 ㅎㅎ 🥣</p>
<div class="post-actions"><button onclick="toggleLike(this)">🤍 15 좋아요</button><button onclick="toast('댓글 기능은 서버 연결 후 사용할 수 있어요 💬')">💬 댓글 2</button></div></article>
</div>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <span class="nav-icon">🏠</span>
    홈
  </a>

  <a href="auth.html" class="nav-item">
    <span class="nav-icon">🐾</span>
    산책
  </a>

  <a href="shop.html" class="nav-item">
    <span class="nav-icon">🛍️</span>
    상점
  </a>

  <a href="feed.html" class="nav-item">
    <span class="nav-icon">💬</span>
    커뮤니티
  </a>

  <a href="mypage.html" class="nav-item">
    <span class="nav-icon">⚙️</span>
    설정
  </a>
</nav>
<script>
function toggleLike(btn){const liked=btn.dataset.liked!=='true';btn.dataset.liked=liked?'true':'false';let n=Number((btn.textContent.match(/\\d+/)||['0'])[0]);btn.textContent=(liked?'❤️ ':'🤍 ')+(n+(liked?1:-1))+' 좋아요';}
function filterFeed(kind,btn){document.querySelectorAll('.tabs .pill').forEach(b=>{b.style.background='white';b.style.color='var(--brown)'});btn.style.background='var(--coral)';btn.style.color='white';document.querySelectorAll('.feed-post').forEach(p=>p.style.display=kind==='all'||p.dataset.kind===kind?'block':'none')}
function toast(msg){alert(msg)}
function publishPost(){const body=document.getElementById('postBody').value.trim();const title=document.getElementById('postTitle').value.trim();if(!body){alert('게시글 내용을 입력해 주세요 🐾');return}const card=document.createElement('article');card.className='card feed-post';card.dataset.kind='daily';const meta=document.createElement('div');meta.className='post-meta';meta.innerHTML='<div class="avatar">🐶</div><div><b>보구미</b><div class="muted">방금 전</div></div>';const heading=document.createElement('b');heading.textContent=title||'오늘의 이야기';const p=document.createElement('p');p.className='post-copy';p.textContent=body;const actions=document.createElement('div');actions.className='post-actions';const like=document.createElement('button');like.textContent='🤍 좋아요';like.onclick=()=>toggleLike(like);actions.append(like);card.append(meta,heading,p,actions);document.querySelector('.feed-post').before(card);document.getElementById('postBody').value='';document.getElementById('postTitle').value='';document.getElementById('composer').style.display='none';alert('게시글이 화면에 추가됐어요. 서버 연결 전까지 새로고침하면 사라져요.')}
</script></body></html>
