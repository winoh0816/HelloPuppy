# 프론트(정적 파일)와 API 를 같은 주소로 서비스한다. API 컨테이너는 바깥에 직접 열지 않는다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 커뮤니티 사진 최대 50MB (backend MAX_COMMUNITY_UPLOAD_BYTES) + 여유
    client_max_body_size 60m;

    # 페이지가 같은 주소의 API 를 쓰게 한다 (api-client.js 는 HELLOPUPPY_API_BASE 가 없으면 127.0.0.1:8000 을 쓴다).
    sub_filter '</head>' '<script>window.HELLOPUPPY_API_BASE = location.origin;</script></head>';
    sub_filter_once on;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(api/|health$) {
        proxy_pass http://api:8000;
        # 덮어쓴다(덧붙이지 않음): 사용자가 보낸 X-Forwarded-For 로 로그인 시도 제한을 피할 수 없게
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # 첫 요청 때 AI 모델을 올리는 시간
    }
}
